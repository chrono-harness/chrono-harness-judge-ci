[package]
name = "chrono-judge-ci"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-ci"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
tracing-tunnel = { version = "0.1.0", default-features = false, features = ["receiver", "sender", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.4"
sha2 = "0.11"
rustix = { version = "1", features = ["net", "fs"] }

[profile.dev.package.sha2]
opt-level = 3
