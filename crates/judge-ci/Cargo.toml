[package]
name = "chrono-judge-ci"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-ci"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
tracing-tunnel = { version = "0.1.0", default-features = false, features = ["receiver", "std"] }
chrono-diagnostics = { git = "https://github.com/chrono-harness/chrono-harness-diagnostics.git", rev = "8da697ff878dbe2e31ddcfe7366714de49e79d03" }
tracing = { version = "0.1", default-features = false, features = ["std"] }
chrono-judge-registration = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "b6bb64c77f832f8c3f5382ee6cc4fa0985022826" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.sha2]
opt-level = 3
