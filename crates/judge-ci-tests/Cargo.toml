[package]
name = "chrono-judge-ci-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-judge-routes = { git = "https://github.com/chrono-harness/chrono-harness-judge-routes.git", rev = "de64456d6571db07ead2dcc2476e7adee551a955" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono-judge-ci = { path = "../judge-ci" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }

[[test]]
name = "verified_collection"
path = "tests/verified_collection.rs"

[[test]]
name = "requirements"
path = "tests/requirements.rs"

[[test]]
name = "project_pairs"
path = "tests/project_pairs.rs"

[[test]]
name = "impact_query"
path = "tests/impact_query.rs"
