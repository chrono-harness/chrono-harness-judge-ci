[package]
name = "chrono-judge-ci-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
vstd = "=0.0.0-2026-11-22-0344"
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-tunnel = { version = "0.1.0", default-features = false, features = ["receiver","sender"] }
serde = { version = "1", features = ["derive"] }
chrono-judge-ci = { path = "../judge-ci" }

[[test]]
name = "verified_collection"
path = "tests/verified_collection.rs"

[[test]]
name = "product_contracts"
path = "tests/product_contracts.rs"

[[test]]
name = "requirements"
path = "tests/requirements.rs"

[[test]]
name = "project_pairs"
path = "tests/project_pairs.rs"

[[test]]
name = "impact_query"
path = "tests/impact_query.rs"

[[test]]
name = "consumption"
path = "tests/consumption.rs"

[[test]]
name = "verified_consumption"
path = "tests/verified_consumption.rs"

[[test]]
name = "trace_source"
path = "tests/trace_source.rs"

[[example]]
name = "release_observation"
path = "tests/verified_consumption.rs"

[[test]]
name = "host_installation"
path = "tests/host_installation.rs"

[dev-dependencies]
sha2 = "0.11"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }

[[test]]
name = "roadmap_adapters"
path = "../../.chrono-harness/ci/roadmap.rs"
